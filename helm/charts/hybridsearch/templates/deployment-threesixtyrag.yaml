{{- if .Values.threesixtyrag.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hybridsearch.fullname" . }}-3sixtyrag
  labels:
    {{- include "hybridsearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: 3sixty-rag
    app: {{ include "hybridsearch.fullname" . }}-3sixtyrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "hybridsearch.fullname" . }}-3sixtyrag
  template:
    metadata:
      labels:
        app: {{ include "hybridsearch.fullname" . }}-3sixtyrag
    spec:
      imagePullSecrets:
{{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.threesixtyrag.podSecurityContext | nindent 8 }}
      containers:
        - name: 3sixty-rag
          image: "{{ .Values.threesixtyrag.image.repository }}:{{ .Values.threesixtyrag.image.tag }}"
          imagePullPolicy: {{ .Values.threesixtyrag.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.threesixtyrag.containerSecurityContext | nindent 12 }}
          envFrom:
          - configMapRef:
              name: {{ include "hybridsearch.fullname" . }}-3sixtyrag-config
          - secretRef:
              name: {{ include "hybridsearch.fullname" . }}-3sixtyrag-secret
          resources:
            {{- toYaml .Values.threesixtyrag.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.threesixtyrag.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: {{ .Values.threesixtyrag.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: {{ .Values.threesixtyrag.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          ports:
            - name: http
              containerPort: {{ .Values.threesixtyrag.service.port }}
          volumeMounts:
            - name: logs
              mountPath: /3sixty-rag-logs
            {{- if .Values.threesixtyrag.caBundle.configMapName }}
            - name: ca-bundle
              mountPath: /app/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- if .Values.threesixtyrag.caBundle.configMapName }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.threesixtyrag.caBundle.configMapName }}
        {{- end }}
{{- end }}
